name: sugar-erp

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sugar_erp
      POSTGRES_USER: sugar_erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the server-only environment}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sugar_erp -d sugar_erp"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  migrate:
    build:
      context: .
      target: build
    command: npm run prisma:migrate:deploy
    environment:
      DATABASE_URL: postgresql://sugar_erp:${POSTGRES_PASSWORD}@postgres:5432/sugar_erp?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sugar_erp:${POSTGRES_PASSWORD}@postgres:5432/sugar_erp?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the server-only environment}
      JWT_EXPIRES_IN: 15m
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [backend]

  integration-test:
    profiles: [test]
    build:
      context: .
      target: build
    command: sh -c "npm run prisma:migrate:deploy && npm run test:integration"
    environment:
      DATABASE_URL: postgresql://sugar_erp:${POSTGRES_PASSWORD}@postgres:5432/sugar_erp_test?schema=public
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: "no"

volumes:
  postgres-data:

networks:
  backend:
    driver: bridge
