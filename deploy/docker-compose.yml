name: sugar-erp

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the server-only .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the server-only .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the server-only environment}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  migrate:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
      target: build
    command: npm run prisma:migrate:deploy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with host postgres in the server-only .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with host postgres in the server-only .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the server-only environment}
      JWT_EXPIRES_IN: 15m
      PORT: 3000
      RELEASES_DIR: /var/lib/sugar-erp/releases
    volumes:
      - ${RELEASES_HOST_DIR:?Set RELEASES_HOST_DIR to an absolute host directory}:/var/lib/sugar-erp/releases:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [backend]

  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:4173:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [backend]

volumes:
  postgres-data:

networks:
  backend:
    driver: bridge
