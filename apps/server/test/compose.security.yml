name: sugar-security-test
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: sugar_security_test
      POSTGRES_USER: sugar_test
      POSTGRES_PASSWORD: synthetic-test-password
    ports:
      - '127.0.0.1:55439:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sugar_test -d sugar_security_test']
      interval: 2s
      timeout: 2s
      retries: 30
